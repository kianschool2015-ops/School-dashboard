# ==============================================================================
# Mashahir Danesh Law School Platform - Edge Nginx Configuration
# High-Throughput Edge Cache & Next.js Reverse Proxy
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip & Brotli compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones (protect against brute force and DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Microcache cache zone for Next.js SSR HTML
    proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html_cache:20m max_size=500m inactive=60m use_temp_path=off;

    upstream nextjs_upstream {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 15M;

        # ----------------------------------------------------------------------
        # 1. Multimedia & Large Static Assets Offloading (Direct Edge Delivery)
        # Prevents Node.js event-loop exhaustion when 200,000 users fetch audio/images
        # ----------------------------------------------------------------------
        location ~* ^/(images|audio)/ {
            root /usr/share/nginx/html/public;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Edge-Cache "HIT-STATIC";
            try_files $uri @proxy_to_nextjs;
        }

        # ----------------------------------------------------------------------
        # 2. Next.js Built-in Bundled Static Assets (_next/static)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Edge-Cache "HIT-NEXT-STATIC";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # 3. Dynamic Application & Server Actions
        # ----------------------------------------------------------------------
        location / {
            limit_conn addr_limit 50;
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Buffering for high concurrency
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout 60s;
        }

        location @proxy_to_nextjs {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
