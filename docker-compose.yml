services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mashahir_support_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # [C-01] 64-byte cryptographic hex secret for JWT token issuance & signature validation
      - JWT_SECRET=${JWT_SECRET:-9f83a4c28d1e7b6530a9e2f418b76c54d3e2a1098b7c6d5e4f3a2b1c0d9e8f7a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c}
      - GARNET_JWT_SECRET=${GARNET_JWT_SECRET:-4b7d91e3f28c6a5029e1d7c3b5a8f4e2091c8b7a6d5e4f3a2b1c0d9e8f7a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e}
      # [H-01] Set to "false" for local HTTP LAN testing (192.168.85.20); change to "true" behind production HTTPS Nginx
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-staging_secret_password_2026}@postgres:5432/${POSTGRES_DB:-mashahir_staging_db}
      # [C-10] Database connection pool capacity for 10,000+ concurrency
      - DB_POOL_MAX=35
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: mashahir_support_db
    restart: always
    # [C-10] Tuned PostgreSQL configuration for 10,000-candidate high concurrency
    command: postgres -c max_connections=300 -c shared_buffers=512MB -c work_mem=16MB -c effective_cache_size=1536MB
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staging_secret_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-mashahir_staging_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mashahir_staging_redis
    restart: always
    # [H-11, M-13] Memory-bounded Redis with LRU eviction and append-only persistence
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      # Bound to localhost interface to prevent unauthorized external access
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
