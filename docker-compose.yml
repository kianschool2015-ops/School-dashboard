services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mashahir_support_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # [C-01] 64-byte cryptographic hex secret for JWT token issuance & signature validation
      - JWT_SECRET=${JWT_SECRET}
      - GARNET_JWT_SECRET=${GARNET_JWT_SECRET}
      # [H-01] Set to "false" for local HTTP LAN testing; set to "true" behind production HTTPS Nginx
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # [C-10] Database connection pool capacity for 10,000+ concurrency
      - DB_POOL_MAX=35
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: mashahir_support_db
    restart: always
    # [C-10] Tuned PostgreSQL configuration for 10,000-candidate high concurrency
    command: postgres -c max_connections=300 -c shared_buffers=512MB -c work_mem=16MB -c effective_cache_size=1536MB
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      # [C-01, H-12] Strict localhost binding prevents unauthorized remote access
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mashahir_staging_redis
    restart: always
    # [H-11, M-13] Password-protected memory-bounded Redis with LRU eviction and append-only persistence
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      # Bound to localhost interface to prevent unauthorized external access
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
