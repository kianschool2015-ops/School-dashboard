; ==============================================================================
; Mashahir Danesh Law School Platform (سامانه مشاهیر دانش)
; Production PgBouncer Configuration File (pgbouncer.ini)
; Tuned for 200,000 Concurrent Users / Mock Bar Exam Saturation
; ==============================================================================

[databases]
; Database alias multiplexing over local PostgreSQL 16 instance
mashahir_support_db = host=postgres port=5432 dbname=mashahir_support_db auth_user=postgres

; Wildcard fallback
* = host=postgres port=5432 auth_user=postgres

[pgbouncer]
;;; ----------------------------------------------------------------------------
;;; Administrative & Network Settings
;;; ----------------------------------------------------------------------------
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, admin
stats_users = monitoring, pgbouncer_exporter

;;; ----------------------------------------------------------------------------
;;; Pooling Mode Topology (Critical for 200,000 Concurrent Connections)
;;; ----------------------------------------------------------------------------
; Transaction pooling mode: connection is held ONLY for the duration of a transaction.
; Multiplexes tens of thousands of client connections into a tight backend pool.
pool_mode = transaction

;;; ----------------------------------------------------------------------------
;;; Connection Limits & Pool Sizing Math
;;; ----------------------------------------------------------------------------
; Total client connections allowed to connect to PgBouncer simultaneously
max_client_conn = 40000

; Maximum server connections to PostgreSQL across all pools
; (PostgreSQL server max_connections should be set to ~150 to prevent OOM/CPU thrashing)
max_db_connections = 120

; Default pool size per (user, database) pair
default_pool_size = 50

; Minimum number of server connections to keep open
min_pool_size = 15

; Additional connections allowed during traffic bursts
reserve_pool_size = 20

; How long clients can wait in queue before reserve pool connections are activated (seconds)
reserve_pool_timeout = 2.0

; Maximum queued client requests before fast 503 rejection
max_user_connections = 40000

;;; ----------------------------------------------------------------------------
;;; Timeouts & Lifetime Management
;;; ----------------------------------------------------------------------------
; Close idle client connections after 120 seconds to free socket FDs
server_idle_timeout = 60.0
client_idle_timeout = 120.0

; Maximum lifetime of a server connection (recycles backends every 30 minutes)
server_lifetime = 1800.0

; Reset server connection state on return to pool
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Query execution timeout safeguard against runaway Cartesian joins (seconds)
query_timeout = 30.0

; Client connection login timeout
client_login_timeout = 10.0

;;; ----------------------------------------------------------------------------
;;; Buffer, Memory & TCP Socket Tuning (High-Throughput Linux Kernel)
;;; ----------------------------------------------------------------------------
pkt_buf = 4096
max_packet_size = 2147483648
listen_backlog = 4096
tcp_defer_accept = 1
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10

;;; ----------------------------------------------------------------------------
;;; Prepared Statements Handling (PgBouncer 1.21+ / Drizzle ORM Support)
;;; ----------------------------------------------------------------------------
max_prepared_statements = 250
